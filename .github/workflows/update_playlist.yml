name: Sync Playlist

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography python-dotenv

      - name: Sync Master, Nasional & Live Event Playlists
        env:
          XR3EDTV_API_BASE: ${{ secrets.XR3EDTV_API_BASE }}
          XR3EDTV_XOR_KEY: ${{ secrets.XR3EDTV_XOR_KEY }}
          XR3EDTV_SALT_KEY: ${{ secrets.XR3EDTV_SALT_KEY }}
          XR3EDTV_ONDEMAND_API: ${{ secrets.XR3EDTV_ONDEMAND_API }}
          XR3EDTV_ONDEMAND_EXTRACT: ${{ secrets.XR3EDTV_ONDEMAND_EXTRACT }}
          XR3EDTV_ONDEMAND_REFERER: ${{ secrets.XR3EDTV_ONDEMAND_REFERER }}
          XR3EDTV_REFERER: ${{ secrets.XR3EDTV_REFERER }}
          XR3EDTV_OUTPUT: 'xr3dtv.m3u8'
          WORKER_AUTH_KEY: ${{ secrets.WORKER_AUTH_KEY }}
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          NASIONAL_SOURCE_URL: ${{ secrets.NASIONAL_SOURCE_URL }}
          NASIONAL_OUTPUT: 'nasional.m3u'
          LIVEEVENT_SRC_URL: ${{ secrets.LIVEEVENT_SRC_URL }}
          LIVEEVENT_REF_URL: ${{ secrets.LIVEEVENT_REF_URL }}
          LIVEEVENT_OUTPUT: 'xr3edtv-liveevent.m3u'

        run: |
          python scripts/sync_nasional.py
          python scripts/update_playlist.py
          python scripts/sync_liveevent.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan temp-branch
          git add xr3dtv.m3u8 nasional.m3u xr3edtv-liveevent.m3u assets/ scripts/ .github/ README.md .gitignore .env.example
          git commit -m "Sync master, 24/7 & live sports playlists [skip ci]"
          git branch -D main
          git branch -m main
          git push origin main --force
